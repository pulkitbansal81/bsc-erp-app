<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BSC Tiles ERP</title>

<!-- ⚠️ SIRF YEH EK LINE BADALNI HAI: apna Apps Script web-app URL yahan paste karo (jo /exec par khatam hota hai) -->
<script>const ERP_URL = "https://script.google.com/macros/s/AKfycbzhAKE86N1NjQUWmwdmKpG9UOLWw5YvO_Oego3vgiKbRwPgsDhrpE6omGvmhO1Hvhm2/exec";</script>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1D33">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html,body{margin:0;padding:0;height:100%;background:#0B1D33;overflow:hidden}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#0B1D33 0%,#0F2B52 55%,#154A99 100%);z-index:10;transition:opacity .4s}
#splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#splash h1{font-size:1.25rem;margin:0;font-weight:800;letter-spacing:-.01em}
#splash p{margin:0;opacity:.65;font-size:.8rem}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#err{display:none;max-width:280px;text-align:center;font-size:.82rem;background:rgba(192,57,43,.25);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:.7rem}
iframe{position:fixed;inset:0;width:100%;height:100%;border:none;background:#F4F7FB}
#exit-scrim{position:fixed;inset:0;background:rgba(11,29,51,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:1.2rem}
#exit-scrim.on{display:flex}
#exit-box{background:#fff;border-radius:16px;padding:1.4rem 1.3rem;max-width:320px;width:100%;font-family:system-ui,sans-serif;box-shadow:0 18px 50px rgba(0,0,0,.4);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
#exit-box h3{margin:0 0 .3rem;color:#0B1D33;font-size:1.05rem}
#exit-box p{margin:0 0 1rem;color:#5B6B80;font-size:.85rem}
#exit-box .row{display:flex;gap:.6rem}
#exit-box button{flex:1;border:none;border-radius:9px;padding:.7rem;font-size:.92rem;font-weight:700;cursor:pointer}
#exit-no{background:#E8F0FB;color:#154A99}
#exit-yes{background:#C0392B;color:#fff}
</style>
</head>
<body>
<div id="splash">
<img src="icon-192.png" alt="">
<h1>BSC Tiles ERP</h1>
<p style="opacity:.45;font-size:.68rem;margin:0">v3</p>
<div class="spin" id="sp"></div>
<p id="msg">Loading…</p>
<div id="err"></div>
</div>
<div id="exit-scrim">
  <div id="exit-box">
    <h3>BSC ERP band karein?</h3>
    <p>App se bahar nikalna chahte ho?</p>
    <div class="row">
      <button id="exit-no">Nahi</button>
      <button id="exit-yes">Haan, band karo</button>
    </div>
  </div>
</div>
<script>
if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
if(!ERP_URL || ERP_URL.indexOf("http")!==0){
document.getElementById("sp").style.display="none";
document.getElementById("msg").textContent="Setup baaki hai";
var er=document.getElementById("err"); er.style.display="block";
er.textContent="index.html mein ERP_URL set nahi hua — line 8 par apna Apps Script /exec URL paste karo.";
}else{
var f=document.createElement("iframe");
f.src=ERP_URL;
f.allow="camera; microphone; geolocation; clipboard-write";
f.onload=function(){ setTimeout(function(){ var s=document.getElementById("splash"); s.style.opacity="0"; setTimeout(function(){ s.style.display="none"; },450); }, 600); };
document.body.appendChild(f);
setTimeout(function(){ var s=document.getElementById("splash"); if(s.style.display!=="none"){ s.style.opacity="0"; setTimeout(function(){ s.style.display="none"; },450);} }, 12000);
}

/* ---- BACK BUTTON → "Exit karein?" dialog (v3) ----
 * Android sach: web app khud ko force-close nahi kar sakti.
 * Isliye "Haan" par guard hata dete hain + user ko ek back aur dabana hota hai. */
(function(){
var scrim=document.getElementById("exit-scrim");
var allowExit=false;
function arm(){ try{ history.pushState({bsc:1},""); }catch(e){} }
arm();
window.addEventListener("popstate", function(){
if(allowExit) return;          // guard off hai — back ko jaane do (exit hoga)
scrim.classList.add("on");     // dialog dikhao
arm();                         // kadam wapas — abhi band nahi hona
});
function bind(id,fn){ var el=document.getElementById(id); el.addEventListener("click",fn); el.addEventListener("touchend",function(ev){ ev.preventDefault(); fn(); }); }
bind("exit-no", function(){ scrim.classList.remove("on"); });
bind("exit-yes", function(){
scrim.classList.remove("on");
allowExit=true;
try{ window.close(); }catch(e){}
setTimeout(function(){
// app abhi bhi khuli hai (Android ne close nahi hone diya) — guard hatao + user ko batao
try{ history.back(); }catch(e){}
var t=document.createElement("div");
t.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0B1D33;color:#fff;padding:10px 18px;border-radius:12px;font-family:system-ui,sans-serif;font-size:14px;z-index:99;box-shadow:0 8px 26px rgba(0,0,0,.45);white-space:nowrap";
t.textContent="Ab ek baar back dabao — app band ho jayegi 👋";
document.body.appendChild(t);
setTimeout(function(){ t.remove(); },3500);
// 4 sec baad guard wapas — agar user ruk gaya to protection phir chalu
setTimeout(function(){ allowExit=false; arm(); },4000);
},150);
});
})();
</script>
</body>
</html>
